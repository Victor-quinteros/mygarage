<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    .profile-page {
      width: min(600px, 92%);
      margin: 50px auto;
      padding-bottom: 40px;
    }

    .profile-page h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .profile-intro {
      color: #aaa;
      margin-bottom: 28px;
    }

    /* Profile picture */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      background: #151515;
      border: 2px solid #39ff14;
      display: block;
    }

    .avatar-upload-label {
      display: inline-block;
      padding: 10px 16px;
      border: 1px solid #39ff14;
      border-radius: 8px;
      color: #39ff14;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .avatar-upload-label:hover {
      background: #39ff14;
      color: #080808;
    }

    #avatar-file {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #avatar-file:focus-visible + .avatar-upload-label {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .avatar-help {
      color: #aaa;
      font-size: 0.85rem;
      text-align: center;
      margin: 0;
    }

    #profile-form {
      display: grid;
      gap: 12px;
    }

    #profile-form label:not(.avatar-upload-label) {
      font-weight: 600;
      margin-top: 8px;
    }

    #profile-form input:not([type="file"]),
    #profile-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #151515;
      color: white;
      font: inherit;
    }

    #profile-form input:focus,
    #profile-form textarea:focus {
      outline: 1px solid #39ff14;
      border-color: #39ff14;
    }

    #profile-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    #profile-form button[type="submit"] {
      margin-top: 16px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #39ff14;
      color: #080808;
      font-weight: bold;
      cursor: pointer;
    }

    #profile-form button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #profile-status {
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

  <main class="profile-page">
    <h1>MY <span class="green">PROFILE</span></h1>

    <p class="profile-intro">

    <form id="profile-form">
      <!-- Profile picture -->
      <div class="avatar-section">
        <img

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="profile.js"></script>

  <!-- Local preview only; persistent uploading is handled by profile.js. -->
  <script>
    (() => {
      const input = document.getElementById("avatar-file");
      const preview = document.getElementById("avatar-preview");
      const status = document.getElementById("profile-status");

      let previewUrl = "";

      input.addEventListener("change", () => {
        const file = input.files && input.files[0];

        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = "";
        }

        if (!file) return;

        const allowedTypes = [
          "image/jpeg",
          "image/png",
          "image/webp",
          "image/gif"
        ];

        if (!allowedTypes.includes(file.type)) {
          input.value = "";
          status.textContent = "Choose a JPG, PNG, WebP or GIF image.";
          return;
        }

        if (file.size > 2 * 1024 * 1024) {
          input.value = "";
          status.textContent = "Your image must be 2 MB or smaller.";
          return;
        }

        previewUrl = URL.createObjectURL(file);
        preview.src = previewUrl;
        status.textContent = "Preview ready. Save your profile to upload it.";
      });
    })();
  </script>
