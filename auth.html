
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Signup | Car Garage</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-page {
      max-width: 460px;
      margin: 45px auto;
      padding: 24px;
      background: #101310;
      border: 1px solid #39ff14;
      border-radius: 14px;
      color: #eee;
    }

    .auth-page h1,
    .auth-page h2 {
      color: #39ff14;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }

    .auth-tabs button,
    .auth-page form button {
      padding: 11px 15px;
      color: #39ff14;
      background: #142014;
      border: 1px solid #39ff14;
      border-radius: 8px;
      cursor: pointer;
    }

    .auth-tabs button.active {
      color: #080908;
      background: #39ff14;
    }

    .auth-page label {
      display: block;
      margin: 14px 0 6px;
    }

    .auth-page input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      color: white;
      background: #080908;
      border: 1px solid #394539;
      border-radius: 8px;
    }

    .auth-page form button {
      width: 100%;
      margin-top: 18px;
    }

    #auth-status {
      overflow-wrap: anywhere;
      color: #39ff14;
    }

    .back-home {
      display: inline-block;
      margin-top: 20px;
      color: #39ff14;
    }

    @media (max-width: 520px) {
      .auth-page {
        margin: 20px 12px;
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <h1>CAR GARAGE</h1>
    <p>Your ride. Your build. Your community.</p>

    <div class="auth-tabs">
      <button type="button" id="show-login" class="active">Login</button>
      <button type="button" id="show-signup">Signup</button>
    </div>

    <form id="login-form">
      <h2>Welcome back</h2>

      <label for="login-email">Email</label>
      <input id="login-email" type="email"
        autocomplete="email" required>

      <label for="login-password">Password</label>
      <input id="login-password" type="password"
        autocomplete="current-password" required>

      <button type="submit">Login</button>
    </form>

    <form id="signup-form" hidden>
      <h2>Join the Garage</h2>

      <label for="signup-name">Display name</label>
      <input id="signup-name" type="text"
        maxlength="40" autocomplete="nickname" required>

      <label for="signup-email">Email</label>
      <input id="signup-email" type="email"
        autocomplete="email" required>

      <label for="signup-password">Password (minimum 8 characters)</label>

<div class="password-wrapper">
  <input
    id="signup-password"
    type="password"
    minlength="8"
    autocomplete="new-password"
    required
  >

  <button
    type="button"
    class="toggle-password"
    id="toggle-signup-password"
    aria-label="Show password"
    aria-pressed="false"
  >👁️</button>
</div>

      <button type="submit">Create Account</button>
    </form>

    <p id="auth-status" role="status" aria-live="polite"></p>
    <a class="back-home" href="index.html">← Back to Garage</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-page.js"></script>
</body>
</html>
