
<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =====================================================
       SECTION 1 — PAGE SETTINGS
  ====================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080908">

  <title>Login / Signup | GARAGE</title>

  <!-- SECTION 2 — MAIN WEBSITE STYLES -->
  <link rel="stylesheet" href="style.css">

  <!-- SECTION 3 — AUTHENTICATION PAGE STYLES -->
  <style>
    .auth-page {
      width: calc(100% - 24px);
      max-width: 460px;
      margin: 45px auto;
      padding: 24px;
      box-sizing: border-box;
      background: #101310;
      border: 1px solid #39ff14;
      border-radius: 14px;
      color: #eee;
      box-shadow: 0 0 24px #39ff1410;
    }

    .auth-page h1,
    .auth-page h2 {
      color: #39ff14;
    }

    .auth-page h1 {
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .auth-intro {
      color: #bbb;
      line-height: 1.5;
    }

    .auth-tabs {
      display: flex;
      gap: 10px;
      margin: 22px 0;
    }

    .auth-tabs button,
    .auth-page form button {
      padding: 12px 15px;
      color: #39ff14;
      background: #142014;
      border: 1px solid #39ff14;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-tabs button {
      flex: 1;
    }

    .auth-tabs button.active {
      color: #080908;
      background: #39ff14;
    }

    .auth-page label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: 700;
    }

    .auth-page input {
      display: block;
      width: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding: 12px;
      color: white;
      background: #080908;
      border: 1px solid #394539;
      border-radius: 8px;
      font-size: 16px;
    }

    .auth-page input:focus {
      outline: 2px solid #39ff14;
      outline-offset: 2px;
    }

    .auth-help {
      display: block;
      margin-top: 6px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
    }

    .auth-page form > button[type="submit"] {
      width: 100%;
      margin-top: 22px;
    }

    .auth-page button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    /* SECTION 3A — PASSWORD VISIBILITY CONTROL */
    .password-wrapper {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .password-wrapper input {
      flex: 1;
    }

    .password-wrapper .toggle-password {
      flex: 0 0 48px;
      padding: 8px;
      color: #39ff14;
      background: #142014;
      border: 1px solid #394539;
      border-radius: 8px;
      cursor: pointer;
    }

    /* SECTION 3B — STATUS MESSAGES */
    #auth-status {
      min-height: 20px;
      margin-top: 18px;
      overflow-wrap: anywhere;
      color: #39ff14;
      font-size: 14px;
      line-height: 1.5;
    }

    /* SECTION 3C — NAVIGATION */
    .back-home {
      display: inline-block;
      margin-top: 12px;
      color: #39ff14;
      text-decoration: none;
    }

    .back-home:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .auth-page {
        margin: 20px auto;
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <!-- =====================================================
       SECTION 4 — AUTHENTICATION CONTAINER
  ====================================================== -->
  <main class="auth-page">

    <!-- SECTION 4A — GARAGE BRANDING -->
    <header>
      <h1>GARAGE<span aria-hidden="true">.</span></h1>
      <p class="auth-intro">
        Your ride. Your build. Your community.
      </p>
    </header>

    <!-- SECTION 4B — LOGIN/SIGNUP TABS -->
    <nav class="auth-tabs" aria-label="Account options">
      <button
        type="button"
        id="show-login"
        class="active"
        aria-controls="login-form"
        aria-pressed="true"
      >
        Login
      </button>

      <button
        type="button"
        id="show-signup"
        aria-controls="signup-form"
        aria-pressed="false"
      >
        Sign Up
      </button>
    </nav>

    <!-- ===================================================
         SECTION 5 — LOGIN FORM
    ==================================================== -->
    <form id="login-form">
      <h2>Welcome back</h2>
      <p class="auth-intro">Log in to your GARAGE account.</p>

      <label for="login-email">Email address</label>
      <input
        id="login-email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="login-password">Password</label>
      <input
        id="login-password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <!-- ===================================================
         SECTION 6 — SIGNUP FORM
    ==================================================== -->
    <form id="signup-form" hidden>
      <h2>Join GARAGE</h2>
      <p class="auth-intro">
        Create your account and join the community.
      </p>

      <!-- SECTION 6A — UNIQUE USERNAME -->
      <label for="signup-username">Username</label>
      <input
        id="signup-username"
        name="username"
        type="text"
        minlength="3"
        maxlength="24"
        pattern="[A-Za-z0-9_]+"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        placeholder="e.g. RoadKing"
        aria-describedby="username-help"
        required
      >
      <small id="username-help" class="auth-help">
        3–24 characters. Use letters, numbers, and underscores.
        Usernames are case-insensitive.
      </small>

      <!-- SECTION 6B — DISPLAY NAME -->
      <label for="signup-name">Display name</label>
      <input
        id="signup-name"
        name="display_name"
        type="text"
        maxlength="40"
        autocomplete="nickname"
        placeholder="Your public name"
        required
      >

      <!-- SECTION 6C — EMAIL -->
      <label for="signup-email">Email address</label>
      <input
        id="signup-email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <!-- SECTION 6D — PASSWORD -->
      <label for="signup-password">
        Password (minimum 8 characters)
      </label>

      <div class="password-wrapper">
        <input
          id="signup-password"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="toggle-signup-password"
          aria-label="Show password"
          aria-pressed="false"
        >
          👁️
        </button>
      </div>

      <!-- SECTION 6E — CREATE ACCOUNT -->
      <button type="submit">Create Account</button>
    </form>

    <!-- ===================================================
         SECTION 7 — STATUS AND FEEDBACK
    ==================================================== -->
    <p id="auth-status" role="status" aria-live="polite"></p>

    <!-- SECTION 8 — RETURN TO HOME PAGE -->
    <a class="back-home" href="index.html">
      ← Back to GARAGE
    </a>

  </main>

  <!-- =====================================================
       SECTION 9 — JAVASCRIPT
       Load Supabase before the existing auth-page.js file.
  ====================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth-page.js"></script>
</body>
</html>
